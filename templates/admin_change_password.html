{% extends "base.html" %}
{% block title %}Şifre Değiştir — Berber Admin{% endblock %}

{% block navbar %}
<nav class="navbar navbar-dark bg-dark px-3">
  <a class="navbar-brand fw-bold" href="/admin/panel">
    <i class="bi bi-scissors me-2"></i>Berber Admin
  </a>
  <div class="d-flex gap-2">
    <a href="/admin/panel" class="btn btn-outline-light btn-sm"><i class="bi bi-speedometer2 me-1"></i>Panel</a>
    <a href="/admin/cikis" class="btn btn-outline-danger btn-sm"><i class="bi bi-box-arrow-right"></i></a>
  </div>
</nav>
{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 480px;">
  <div class="text-center mb-4">
    <i class="bi bi-key display-4 text-primary"></i>
    <h3 class="fw-bold mt-2">Admin Şifresini Değiştir</h3>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-body p-4">
      <form method="POST">
        <div class="mb-3">
          <label class="form-label fw-semibold">Mevcut Şifre</label>
          <input type="password" name="current_password" class="form-control form-control-lg" autofocus required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Yeni Şifre</label>
          <input type="password" name="new_password" class="form-control form-control-lg" minlength="6" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Yeni Şifre (Tekrar)</label>
          <input type="password" name="new_password2" class="form-control form-control-lg" minlength="6" required>
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-primary btn-lg">
            <i class="bi bi-check-lg me-2"></i>Şifreyi Değiştir
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
