{% extends "base.html" %}
{% block title %}Hizmet Fiyatları — Berber Admin{% endblock %}

{% block navbar %}
<nav class="navbar navbar-dark bg-dark px-3">
  <a class="navbar-brand fw-bold" href="/admin/panel">
    <i class="bi bi-scissors me-2"></i>Berber Admin
  </a>
  <div class="d-flex gap-2">
    <a href="/admin/panel" class="btn btn-outline-light btn-sm"><i class="bi bi-speedometer2 me-1"></i>Panel</a>
    <a href="/admin/sifre-degistir" class="btn btn-outline-light btn-sm"><i class="bi bi-key"></i></a>
    <a href="/admin/cikis" class="btn btn-outline-danger btn-sm"><i class="bi bi-box-arrow-right"></i></a>
  </div>
</nav>
{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 640px;">
  <div class="text-center mb-4">
    <i class="bi bi-cash-coin display-4 text-primary"></i>
    <h3 class="fw-bold mt-2">Hizmet Fiyatları</h3>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-body p-4">
      <form method="POST">
        {% for s in services %}
        <div class="row align-items-center mb-3">
          <div class="col-6">
            <div class="fw-semibold">{{ s.name }}</div>
            <div class="text-muted small">{{ s.duration }} dk</div>
          </div>
          <div class="col-6">
            <div class="input-group">
              <input type="number" min="0" step="1" name="price_{{ s.id }}"
                     class="form-control" value="{{ s.price }}" required>
              <span class="input-group-text">₺</span>
            </div>
          </div>
        </div>
        {% endfor %}
        <div class="d-grid mt-4">
          <button type="submit" class="btn btn-primary btn-lg">
            <i class="bi bi-check-lg me-2"></i>Fiyatları Kaydet
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
